name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Catches common misspellings in the code, the texts shown to users and the docs.
  spelling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check spelling
        run: |
          pip install --quiet codespell
          # notIn is an Azure Pipelines function, not a misspelling.
          codespell src tests docs deploy README.md .github --skip="*/bin/*,*/obj/*,*/node_modules/*" --ignore-words-list notin > spelling.log || {
            echo "::error title=Spelling::$(sed ':a;N;$!ba;s/\n/%0A/g' spelling.log | head -c 6000)"
            cat spelling.log
            exit 1
          }

  # Opens the published app in a real browser and clicks through the wizard. The other tests never
  # run the page's JavaScript or its Content-Security-Policy.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Publish and start the app
        env:
          # As on a server, but without Windows login: this machine is not in a domain.
          ASPNETCORE_ENVIRONMENT: Production
          ASPNETCORE_URLS: http://localhost:5150
          Authentication__Mode: None
        run: |
          dotnet publish src/PipelineBuilder.Web --configuration Release --output publish
          cd publish
          nohup dotnet PipelineBuilder.Web.dll > ../app.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:5150/ > /dev/null && exit 0; sleep 1; done
          echo "::error title=Browser test::The app did not start."; cat ../app.log; exit 1

      - name: Click through the wizard
        working-directory: tests/browser
        run: |
          npm install --no-audit --no-fund --silent
          node wizard.mjs

      - name: App log
        if: failure()
        run: cat app.log

  build-and-test:
    runs-on: ubuntu-latest
    # A real SQL Server for the database tests (SqlPipelineStoreTests). Test-only, thrown away after the run.
    services:
      sql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: Test-only-Pa55
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P Test-only-Pa55 -Q 'SELECT 1' || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 20
    env:
      PIPELINEBUILDER_SQL: Server=localhost,1433;User ID=sa;Password=Test-only-Pa55;Encrypt=True;TrustServerCertificate=True
      # Minimum coverage. Raise these when coverage rises; never lower them.
      MIN_LINE_COVERAGE: 90
      MIN_BRANCH_COVERAGE: 80
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: |
          set -o pipefail
          # Surface NuGet errors (e.g. vulnerable or missing packages) as annotations on the run.
          dotnet restore PipelineBuilder.sln 2>&1 | tee restore.log || {
            grep -E "error|warning" restore.log | sort -u | head -20 | while read -r line; do echo "::error title=Restore::$line"; done
            exit 1
          }

      # Warnings are errors (Directory.Build.props), so this step fails on any new warning.
      - name: Build
        run: |
          set -o pipefail
          # Show every compile error in one annotation (GitHub lists only the first ten otherwise).
          dotnet build PipelineBuilder.sln --configuration Release --no-restore 2>&1 | tee build.log || {
            errors=$(grep -E ": error " build.log | sed -E 's#^/home/runner/work/[^/]+/[^/]+/##; s# \[/home/runner.*$##' | sort -u | head -80)
            echo "::error title=Build errors::${errors//$'\n'/%0A}"
            exit 1
          }

      - name: Test
        run: >-
          dotnet test PipelineBuilder.sln --configuration Release --no-build
          --logger "console;verbosity=normal" --logger GitHubActions
          --logger "trx;LogFileName=results.trx" --results-directory TestResults
          --collect:"XPlat Code Coverage"

      - name: Test summary
        if: always()
        run: |
          shopt -s nullglob
          for f in TestResults/*.trx; do
            c=$(grep -o "<Counters [^>]*>" "$f")
            echo "::notice title=Test results::$c"
          done

      - name: Coverage report
        if: always()
        run: |
          shopt -s nullglob globstar
          reports=(TestResults/**/coverage.cobertura.xml)
          if [ ${#reports[@]} -eq 0 ]; then echo "No coverage data"; exit 0; fi
          dotnet tool install --global dotnet-reportgenerator-globaltool --version 5.5.11
          reportgenerator -reports:"TestResults/**/coverage.cobertura.xml" -targetdir:coverage \
            -reporttypes:"Html;MarkdownSummaryGithub;TextSummary" -assemblyfilters:"-*.Tests"
          cat coverage/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
          line=$(grep -m1 "Line coverage" coverage/Summary.txt | sed 's/^ *//')
          branch=$(grep -m1 "Branch coverage" coverage/Summary.txt | sed 's/^ *//')
          echo "::notice title=Coverage::$line, $branch"
          # Fail the build when coverage drops below the minimum.
          below() { awk -v actual="$1" -v minimum="$2" 'BEGIN { exit !(actual + 0 < minimum + 0) }'; }
          line_pct=$(echo "$line" | grep -oE '[0-9]+([.,][0-9]+)?' | head -1 | tr ',' '.')
          branch_pct=$(echo "$branch" | grep -oE '[0-9]+([.,][0-9]+)?' | head -1 | tr ',' '.')
          failed=0
          if below "$line_pct" "$MIN_LINE_COVERAGE"; then
            echo "::error title=Coverage::Line coverage $line_pct% is below the minimum of $MIN_LINE_COVERAGE%"; failed=1
          fi
          if below "$branch_pct" "$MIN_BRANCH_COVERAGE"; then
            echo "::error title=Coverage::Branch coverage $branch_pct% is below the minimum of $MIN_BRANCH_COVERAGE%"; failed=1
          fi
          exit $failed

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage
          if-no-files-found: ignore
