name: IIS install test

# Publishes the app and installs it on IIS on a Windows runner with deploy/Install-PipelineBuilder.ps1,
# answers its questions for a second site, moves the first to HTTPS in another folder, and checks on
# every address that anonymous requests are refused and Windows-authenticated requests get the wizard.
on:
  pull_request:
    paths:
      - 'deploy/**'
      - 'src/PipelineBuilder.Web/**'
      - '.github/workflows/iis.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  iis:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Publish
        run: dotnet publish src/PipelineBuilder.Web -c Release -o publish

      - name: Install IIS features
        shell: pwsh
        run: Install-WindowsFeature -Name Web-Server, Web-WebSockets, Web-Windows-Auth -IncludeManagementTools | Out-Null

      - name: Install the ASP.NET Core Hosting Bundle (.NET 10)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # The official release list names the current Hosting Bundle download.
          $releases = Invoke-RestMethod 'https://builds.dotnet.microsoft.com/dotnet/release-metadata/10.0/releases.json'
          $latest = $releases.releases | Where-Object { $_.'release-version' -eq $releases.'latest-release' } | Select-Object -First 1
          $bundle = $latest.'aspnetcore-runtime'.files | Where-Object { $_.name -like 'dotnet-hosting-win.exe' } | Select-Object -First 1
          if (-not $bundle) { throw 'Hosting Bundle download not found in releases.json' }
          Write-Host "Installing $($bundle.url)"
          Invoke-WebRequest $bundle.url -OutFile hosting.exe
          Start-Process hosting.exe -ArgumentList '/install', '/quiet', '/norestart' -Wait
          net stop was /y | Out-Null
          net start w3svc | Out-Null

      - name: Run the install script
        shell: pwsh
        run: |
          try {
            ./deploy/Install-PipelineBuilder.ps1 -PublishFolder publish -Port 8080
          }
          catch {
            # Show the failure on the run summary, including where in the script it happened.
            $message = ($_ | Out-String) -replace "`r?`n", ' '
            Write-Host "::error title=Install script::$message $($_.ScriptStackTrace -replace "`r?`n", ' <- ')"
            exit 1
          }

      - name: Answer the questions
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # The script asks only when someone can answer; here the answers come in typed lines.
          $env:CI = $null
          # Name, folder, S to skip HTTPS, any host name, port 8081, every domain user.
          # No -PublishFolder: the app is taken from the 'publish' folder next to the deploy folder.
          "PipelineBuilderAsked`nC:\apps\asked`nS`n`n8081`n`n" |
            powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./deploy/Install-PipelineBuilder.ps1
          if ($LASTEXITCODE -ne 0) { Write-Host "::error title=Questions::The script failed (exit code $LASTEXITCODE)."; exit 1 }
          $appcmd = "$env:windir\System32\inetsrv\appcmd.exe"
          $folder = & $appcmd list vdir 'PipelineBuilderAsked/' /text:physicalPath
          $pool = & $appcmd list app 'PipelineBuilderAsked/' /text:applicationPool
          if (-not $folder) { Write-Host '::error title=Questions::The website was not given the typed name.'; exit 1 }
          if ($folder -ne 'C:\apps\asked') { Write-Host "::error title=Questions::The app is in $folder, not in the typed folder."; exit 1 }
          if ($pool -ne 'PipelineBuilderAsked') { Write-Host "::error title=Questions::The app pool is $pool, not named after the site."; exit 1 }
          if (-not (Test-Path C:\apps\asked\PipelineBuilder.Web.dll)) { Write-Host '::error title=Questions::The app was not installed in the typed folder.'; exit 1 }
          if (Test-Path C:\apps\asked\appsettings.Production.json) { Write-Host '::error title=Questions::No groups were typed, yet access is limited.'; exit 1 }
          Write-Host 'The typed name and folder were used.' -ForegroundColor Green

      - name: Move the first site to HTTPS in another folder
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $certificate = New-SelfSignedCertificate -DnsName localhost -CertStoreLocation Cert:\LocalMachine\My
          # Trusted, so the HTTPS check below is a real one.
          $root = Get-Item Cert:\LocalMachine\Root
          $root.Open('ReadWrite'); $root.Add($certificate); $root.Close()
          # Handed over as a .pfx file, as a certificate usually arrives: the script imports it.
          $password = ConvertTo-SecureString 'Test-only-1' -AsPlainText -Force
          Export-PfxCertificate -Cert $certificate -FilePath site.pfx -Password $password | Out-Null
          Remove-Item "Cert:\LocalMachine\My\$($certificate.Thumbprint)" -DeleteKey
          ./deploy/Install-PipelineBuilder.ps1 -PublishFolder publish -PhysicalPath C:\apps\pipelinebuilder `
            -HostName localhost -Port 8443 -CertificateFile site.pfx -CertificatePassword $password
          if (-not (Test-Path "Cert:\LocalMachine\My\$($certificate.Thumbprint)")) { Write-Host '::error title=HTTPS::The certificate file was not imported.'; exit 1 }
          $folder = & "$env:windir\System32\inetsrv\appcmd.exe" list vdir 'PipelineBuilder/' /text:physicalPath
          if ($folder -ne 'C:\apps\pipelinebuilder') { Write-Host '::error title=HTTPS::The site was not moved to the new folder.'; exit 1 }

      - name: Check Windows login
        shell: pwsh
        run: |
          function Fail([string] $message, $response) {
            $body = if ($response) { ($response.Content -replace '<[^>]+>', ' ' -replace '\s+', ' ').Trim() } else { '' }
            if ($body.Length -gt 600) { $body = $body.Substring(0, 600) }
            Write-Host "::error title=Windows login::$url $message | $body"
            exit 1
          }

          # Signed in as the runner's Windows account, without following redirects, so each hop is seen.
          function SignedIn([string] $address) {
            $handler = [System.Net.Http.HttpClientHandler]::new()
            $handler.UseDefaultCredentials = $true
            $handler.AllowAutoRedirect = $false
            $response = [System.Net.Http.HttpClient]::new($handler).GetAsync($address).GetAwaiter().GetResult()
            [pscustomobject]@{
              StatusCode = [int]$response.StatusCode
              Location = [string]$response.Headers.Location
              Content = $response.Content.ReadAsStringAsync().GetAwaiter().GetResult()
            }
          }

          trap { Write-Host "::error title=Windows login::$(($_ | Out-String) -replace "`r?`n", ' ')"; exit 1 }

          foreach ($url in 'http://localhost:8080/', 'https://localhost:8443/', 'http://localhost:8081/') {
            Write-Host "== $url"
            # Anonymous: refused with a Windows authentication challenge.
            $anonymous = Invoke-WebRequest $url -SkipHttpErrorCheck
            Write-Host "Anonymous: $($anonymous.StatusCode) $($anonymous.Headers['WWW-Authenticate'])"
            if ($anonymous.StatusCode -ne 401) { Fail "Expected 401 for anonymous requests, got $($anonymous.StatusCode)" $anonymous }

            # Signed in: the wizard and the signed-in user are shown. Kerberos/NTLM do not send the password itself.
            $signedIn = SignedIn $url
            # A site with HTTPS sends HTTP requests there. Followed by hand, as a browser signs in again there.
            if ($signedIn.StatusCode -in 301, 302, 307, 308) {
              $next = $signedIn.Location
              Write-Host "Redirected to $next"
              if ($next -notlike 'https://localhost:8443/*') { Fail "Redirected to $next instead of the HTTPS address" $signedIn }
              $signedIn = SignedIn $next
            }
            Write-Host "Signed in: $($signedIn.StatusCode)"
            if ($signedIn.StatusCode -ne 200) { Fail "Expected 200 with Windows credentials, got $($signedIn.StatusCode)" $signedIn }
            if ($signedIn.Content -notmatch 'What are you deploying') { Fail 'The wizard did not render.' $signedIn }
            if ($signedIn.Content -notmatch 'Signed in as') { Fail 'The signed-in user is not shown.' $signedIn }
          }
          Write-Host 'Windows login works on HTTP and HTTPS.' -ForegroundColor Green

      - name: IIS logs on failure
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem C:\inetpub\logs\LogFiles -Recurse -File -ErrorAction SilentlyContinue | Select-Object -Last 1 | Get-Content -Tail 30
          Get-WinEvent -LogName Application -MaxEvents 30 -ErrorAction SilentlyContinue |
            Where-Object ProviderName -match 'IIS|AspNetCore|\.NET Runtime' | Select-Object -First 5 |
            ForEach-Object { Write-Host "::warning title=$($_.ProviderName)::$(($_.Message -replace "`r?`n", ' ').Substring(0, [Math]::Min(800, $_.Message.Length)))" }
