name: Update golden files

# Regenerates tests/PipelineBuilder.Tests/Golden/*.yml and commits them to the branch, for review in the PR.
# Start it from the Actions tab on a branch, or push a commit whose message contains [update-golden].
on:
  workflow_dispatch:
  push:
    branches-ignore: [main]

permissions:
  contents: write

jobs:
  update:
    if: >-
      github.ref != 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[update-golden]'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Regenerate golden files
        env:
          PIPELINEBUILDER_UPDATE_GOLDEN: '1'
        run: dotnet test tests/PipelineBuilder.Tests --configuration Release --filter "FullyQualifiedName~GoldenFileTests"

      - name: Commit changes
        run: |
          git add tests/PipelineBuilder.Tests/Golden
          if git diff --cached --quiet; then
            echo "::notice title=Golden files::No changes."
            exit 0
          fi
          changed=$(git diff --cached --name-only | xargs -n1 basename | tr '\n' ' ')
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update golden files" -m "Regenerated by the Update golden files workflow. Review the diff before merging."
          git push
          # Commits pushed by this workflow do not start CI; push again (or re-run CI) to test them.
          echo "::notice title=Golden files::Updated: $changed. Push another commit or re-run CI to test them."
