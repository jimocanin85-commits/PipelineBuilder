# Weekly update pull requests for NuGet packages and GitHub Actions.
# Minor and patch updates are grouped into one PR per ecosystem; CI must pass before merging.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Copenhagen
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Copenhagen
    groups:
      actions:
        patterns: ["*"]
