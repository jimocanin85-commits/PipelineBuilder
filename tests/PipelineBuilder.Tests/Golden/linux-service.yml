# Made with PipelineBuilder. To change it, open your saved settings there, or edit this file.
# Pipeline: my-app

# Runs when one of these branches changes.
trigger:
  branches:
    include:
      - 'main'
      - 'develop'

# The environments to deploy to, in order. Each must exist under Pipelines > Environments.
parameters:
- name: environments
  displayName: 'Environments, in deployment order'
  type: object
  default:
  - 'test'
  - 'preprod'
  - 'prod'

# Values used by the steps below.
variables:
  - name: BuildConfiguration
    value: Release

# Builds run on this agent. Deployments run on the servers registered in each environment.
pool:
  vmImage: 'ubuntu-latest'

stages:
# Build once, deploy many: the app is compiled, tested and packaged here. Every environment gets this same package.
- stage: Build
  displayName: 'Build'
  jobs:
  - job: BuildJob
    displayName: 'Build, test and package'
    steps:
      - task: DotNetCoreCLI@2
        displayName: 'Restore NuGet packages'
        inputs:
          command: 'restore'
          projects: '**/*.csproj'
      - task: DotNetCoreCLI@2
        displayName: 'Build'
        inputs:
          command: 'build'
          projects: '**/*.csproj'
          arguments: '--configuration $(BuildConfiguration) --no-restore'
      - task: DotNetCoreCLI@2
        displayName: 'Run tests'
        inputs:
          command: 'test'
          projects: '**/*Tests*.csproj'
          arguments: '--configuration $(BuildConfiguration) --no-build --collect:"XPlat Code Coverage"'
      - task: DotNetCoreCLI@2
        displayName: 'Publish application'
        inputs:
          command: 'publish'
          publishWebProjects: 'true'
          arguments: '--configuration $(BuildConfiguration) --no-build --output $(Build.ArtifactStagingDirectory)/app'
          zipAfterPublish: 'false'
          modifyOutputPath: 'false'
      - task: PublishPipelineArtifact@1
        displayName: 'Publish pipeline artifact: drop'
        inputs:
          targetPath: '$(Build.ArtifactStagingDirectory)/app'
          artifactName: 'drop'
          publishLocation: 'pipeline'
# Deploy: repeated for each environment, one after the other. Nothing is built again.
- ${{ each environment in parameters.environments }}:
  - stage: Deploy_${{ replace(environment, '-', '_') }}
    displayName: 'Deploy ${{ environment }}'
    # Only the main branch deploys to prod.
    ${{ if in(environment, 'prod') }}:
      condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
    - deployment: Deploy
      displayName: 'Deploy to ${{ environment }}'
      # Runs on each server registered in this environment.
      environment:
        name: ${{ environment }}
        resourceType: VirtualMachine
      strategy:
        runOnce:
          deploy:
            steps:
              - download: none
              - task: DownloadPipelineArtifact@2
                displayName: 'Download artifact'
                inputs:
                  artifactName: 'drop'
                  targetPath: '$(Pipeline.Workspace)/drop'
              - bash: |
                  set -euo pipefail
                  envRoot='/var/backups/pipelinebuilder/${{ environment }}'
                  backup="$envRoot/$(Build.BuildId)"
                  target='$(DEPLOY_PATH)'
                  sync_folder() {
                    mkdir -p "$2"
                    if command -v rsync >/dev/null 2>&1; then
                      rsync -a --delete "$1"/ "$2"/
                    else
                      find "$2" -mindepth 1 -delete
                      cp -a "$1"/. "$2"/
                    fi
                  }
                  if [ -d "$target" ]; then
                    sync_folder "$target" "$backup"
                    echo "Backed up $target to $backup"
                  else
                    echo "Nothing to back up: $target does not exist yet"
                  fi
                  if [ -d "$envRoot" ]; then
                    ls -1dt "$envRoot"/*/ 2>/dev/null | tail -n +6 | xargs -r rm -rf || true
                  fi
                displayName: 'Back up deployment folder before deploy'
              - bash: |
                  set -euo pipefail
                  service='$(SERVICE_NAME)'
                  target='$(DEPLOY_PATH)'
                  package='$(Pipeline.Workspace)/drop'
                  sync_folder() {
                    mkdir -p "$2"
                    if command -v rsync >/dev/null 2>&1; then
                      rsync -a --delete "$1"/ "$2"/
                    else
                      find "$2" -mindepth 1 -delete
                      cp -a "$1"/. "$2"/
                    fi
                  }
                  as_root() {
                    if [ "`id -u`" -eq 0 ]; then "$@"; else sudo -n "$@"; fi
                  }
                  if [[ "$package" == *.zip ]]; then
                    source="$AGENT_TEMPDIRECTORY/package"
                    rm -rf "$source"
                    mkdir -p "$source"
                    unzip -q "$package" -d "$source"
                  else
                    source="$package"
                  fi
                  as_root systemctl stop "$service" || echo "Service $service was not running"
                  sync_folder "$source" "$target"
                  as_root systemctl start "$service"
                  echo "Deployed to $target and started $service"
                displayName: 'Deploy Linux service (${{ environment }})'
          # If a step above fails, the previous version is put back.
          on:
            failure:
              steps:
                - bash: |
                    set -euo pipefail
                    envRoot='/var/backups/pipelinebuilder/${{ environment }}'
                    backup="$envRoot/$(Build.BuildId)"
                    if [ ! -d "$backup" ]; then
                      echo "##vso[task.logissue type=warning]No backup found at $backup (first deployment?). Nothing to roll back."
                      exit 0
                    fi
                    service='$(SERVICE_NAME)'
                    target='$(DEPLOY_PATH)'
                    sync_folder() {
                      mkdir -p "$2"
                      if command -v rsync >/dev/null 2>&1; then
                        rsync -a --delete "$1"/ "$2"/
                      else
                        find "$2" -mindepth 1 -delete
                        cp -a "$1"/. "$2"/
                      fi
                    }
                    as_root() {
                      if [ "`id -u`" -eq 0 ]; then "$@"; else sudo -n "$@"; fi
                    }
                    as_root systemctl stop "$service" || true
                    sync_folder "$backup" "$target"
                    as_root systemctl start "$service"
                    echo "Restored $target from $backup and restarted $service"
                  displayName: 'Roll back Linux service'