# Generated by PipelineBuilder - Enterprise Azure DevOps Pipeline
# Pipeline: enterprise-pipeline
trigger:
  branches:
    include:
      - 'main'
      - 'develop'

variables:
  - group: 'vg-test'
  - name: BuildConfiguration
    value: Release

pool:
  vmImage: 'windows-latest'

stages:
- stage: Build
  displayName: 'Build'
  jobs:
  - job: BuildJob
    displayName: 'Build, test and package'
    pool:
      vmImage: 'ubuntu-latest'
    steps:
          - task: NodeTool@0
            displayName: 'Use Node.js 24.x'
            inputs:
              versionSpec: '24.x'
          - task: Npm@1
            displayName: 'Install packages (npm ci)'
            inputs:
              command: 'ci'
          - task: Npm@1
            displayName: 'Build'
            inputs:
              command: 'custom'
              customCommand: 'run build --if-present'
            env:
              CI: 'true'
          - task: Npm@1
            displayName: 'Run tests'
            inputs:
              command: 'custom'
              customCommand: 'run test --if-present'
            env:
              CI: 'true'
          - task: CopyFiles@2
            displayName: 'Copy build output (dist)'
            inputs:
              SourceFolder: 'dist'
              Contents: '**'
              TargetFolder: '$(Build.ArtifactStagingDirectory)/app'
          - task: PublishPipelineArtifact@1
            displayName: 'Publish pipeline artifact: drop'
            inputs:
              targetPath: '$(Build.ArtifactStagingDirectory)/app'
              artifactName: 'drop'
              publishLocation: 'pipeline'
- stage: Deploy_test
  displayName: 'Deploy test'
  dependsOn: Build
  condition: succeeded()
  jobs:
  - deployment: DeployTotest
    displayName: 'Deploy to test'
    environment: test
    strategy:
      runOnce:
        deploy:
          steps:
          - download: none
          - task: DownloadPipelineArtifact@2
            displayName: 'Download artifact for test'
            inputs:
              artifactName: 'drop'
              targetPath: '$(Pipeline.Workspace)/drop'
          - task: AzureWebApp@1
            displayName: 'Deploy to Azure App Service (test)'
            inputs:
              azureSubscription: '$(AZURE_SERVICE_CONNECTION)'
              appType: 'webApp'
              appName: '$(WEBAPP_NAME)'
              package: '$(Pipeline.Workspace)/drop'
          - powershell: |
              $uri = 'https://myapp-test.contoso.com/health'
              $expected = 200
              $timeout = 30
              $retries = 3
              for ($i = 1; $i -le $retries; $i++) {
                try {
                  $r = Invoke-WebRequest -Uri $uri -UseBasicParsing -TimeoutSec $timeout
                  if ($r.StatusCode -eq $expected) { Write-Host 'Health check passed'; exit 0 }
                } catch { Write-Warning "Attempt $i failed: $_" }
                Start-Sleep -Seconds 5
              }
              Write-Error 'HTTP health check failed'
              exit 1
            displayName: 'HTTP endpoint health check'
        on:
          failure:
            steps:
            - powershell: |
                Write-Warning 'Deployment failed. If the slot swap already happened, swap back manually:'
                Write-Warning '  az webapp deployment slot swap -g $(RESOURCE_GROUP) -n $(WEBAPP_NAME) --slot staging --target-slot production'
              displayName: 'App Service rollback guidance'
- stage: Deploy_prod
  displayName: 'Deploy prod'
  dependsOn: Deploy_test
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  variables:
    - group: 'vg-prod-secrets'
  jobs:
  - deployment: DeployToprod
    displayName: 'Deploy to prod'
    environment: prod
    strategy:
      runOnce:
        deploy:
          steps:
          - download: none
          - task: DownloadPipelineArtifact@2
            displayName: 'Download artifact for prod'
            inputs:
              artifactName: 'drop'
              targetPath: '$(Pipeline.Workspace)/drop'
          - task: AzureWebApp@1
            displayName: 'Deploy to Azure App Service (prod)'
            inputs:
              azureSubscription: '$(AZURE_SERVICE_CONNECTION)'
              appType: 'webApp'
              appName: '$(WEBAPP_NAME)'
              package: '$(Pipeline.Workspace)/drop'
          - powershell: |
              $uri = 'https://myapp-prod.contoso.com/health'
              $expected = 200
              $timeout = 30
              $retries = 3
              for ($i = 1; $i -le $retries; $i++) {
                try {
                  $r = Invoke-WebRequest -Uri $uri -UseBasicParsing -TimeoutSec $timeout
                  if ($r.StatusCode -eq $expected) { Write-Host 'Health check passed'; exit 0 }
                } catch { Write-Warning "Attempt $i failed: $_" }
                Start-Sleep -Seconds 5
              }
              Write-Error 'HTTP health check failed'
              exit 1
            displayName: 'HTTP endpoint health check'
        on:
          failure:
            steps:
            - powershell: |
                Write-Warning 'Deployment failed. If the slot swap already happened, swap back manually:'
                Write-Warning '  az webapp deployment slot swap -g $(RESOURCE_GROUP) -n $(WEBAPP_NAME) --slot staging --target-slot production'
              displayName: 'App Service rollback guidance'
- stage: Notify_Failure
  displayName: 'Notify on failure'
  dependsOn: 
  - Build
  - Deploy_test
  - Deploy_prod
  condition: failed()
  jobs:
  - job: Notify
    steps:
          - powershell: |
              $webhook = '$(TEAMS_WEBHOOK_URL)'
              if ([string]::IsNullOrWhiteSpace($webhook) -or $webhook.StartsWith('$(')) {
                Write-Warning 'Teams webhook variable is not set; skipping notification.'
                exit 0
              }
              $body = @{ text = "Pipeline $(Build.DefinitionName) #$(Build.BuildNumber) failed" } | ConvertTo-Json
              Invoke-RestMethod -Uri $webhook -Method Post -Body $body -ContentType 'application/json'
            displayName: 'Notify Teams on failure'