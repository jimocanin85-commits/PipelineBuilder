# Generated by PipelineBuilder - Enterprise Azure DevOps Pipeline
# Pipeline: enterprise-pipeline
trigger:
  branches:
    include:
      - 'main'
      - 'develop'

variables:
  - group: 'vg-test'
  - name: BuildConfiguration
    value: Release

pool:
  vmImage: 'windows-latest'

stages:
- stage: Build
  displayName: 'Build'
  jobs:
  - job: BuildJob
    displayName: 'Build, test and package'
    pool:
      vmImage: 'ubuntu-latest'
    steps:
          - powershell: |
              Write-Warning 'Add the build and test commands for Terraform projects here.'
            displayName: 'Build and test (placeholder)'
          - powershell: |
              Write-Warning 'Add the build/copy commands for Terraform projects here. Put the deployable output in $(Build.ArtifactStagingDirectory)/app.'
              New-Item -ItemType Directory -Force -Path "$(Build.ArtifactStagingDirectory)/app" | Out-Null
            displayName: 'Prepare build output (placeholder)'
          - task: PublishPipelineArtifact@1
            displayName: 'Publish pipeline artifact: drop'
            inputs:
              targetPath: '$(Build.ArtifactStagingDirectory)/app'
              artifactName: 'drop'
              publishLocation: 'pipeline'
- stage: Deploy_test
  displayName: 'Deploy test'
  dependsOn: Build
  condition: succeeded()
  jobs:
  - deployment: Infrastructure
    displayName: 'Infrastructure (test)'
    pool:
      vmImage: 'windows-latest'
    environment: test
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
          - task: TerraformTaskV4@4
            displayName: 'Terraform init'
            inputs:
              provider: 'azurerm'
              command: 'init'
              workingDirectory: 'infra'
              backendServiceArm: '$(AZURE_SERVICE_CONNECTION)'
              backendAzureRmResourceGroupName: '$(TF_STATE_RG)'
              backendAzureRmStorageAccountName: '$(TF_STATE_STORAGE)'
              backendAzureRmContainerName: '$(TF_STATE_CONTAINER)'
              backendAzureRmKey: '$(Build.DefinitionName)-test.tfstate'
          - task: TerraformTaskV4@4
            displayName: 'Terraform plan'
            inputs:
              provider: 'azurerm'
              command: 'plan'
              workingDirectory: 'infra'
              commandOptions: '-input=false -out=tfplan'
              environmentServiceNameAzureRM: '$(AZURE_SERVICE_CONNECTION)'
          - task: TerraformTaskV4@4
            displayName: 'Terraform apply'
            inputs:
              provider: 'azurerm'
              command: 'apply'
              workingDirectory: 'infra'
              commandOptions: '-input=false tfplan'
              environmentServiceNameAzureRM: '$(AZURE_SERVICE_CONNECTION)'
  - deployment: DeployTotest
    displayName: 'Deploy to test'
    dependsOn: Infrastructure
    environment: test
    strategy:
      runOnce:
        deploy:
          steps:
          - download: none
          - task: DownloadPipelineArtifact@2
            displayName: 'Download artifact for test'
            inputs:
              artifactName: 'drop'
              targetPath: '$(Pipeline.Workspace)/drop'
          - powershell: |
              $ErrorActionPreference = 'Stop'
              $envRoot = Join-Path 'D:\backups' 'test'
              $backup = Join-Path $envRoot '$(Build.BuildId)'
              $site = 'Default Web Site'
              $target = $null
              if (-not $target) {
                Import-Module WebAdministration -ErrorAction Stop
                $website = Get-Website -Name $site
                if (-not $website) { throw "IIS website '$site' was not found" }
                $target = [Environment]::ExpandEnvironmentVariables($website.PhysicalPath)
              }
              function Sync-Folder([string]$Source, [string]$Destination, [switch]$Mirror) {
                New-Item -ItemType Directory -Force -Path $Destination | Out-Null
                $mode = if ($Mirror) { '/MIR' } else { '/E' }
                robocopy $Source $Destination $mode /R:2 /W:5 /NFL /NDL /NP | Out-Host
                if ($LASTEXITCODE -ge 8) { throw "robocopy failed with exit code $LASTEXITCODE" }
                $global:LASTEXITCODE = 0
              }
              if (Test-Path $target) {
                Sync-Folder -Source $target -Destination $backup
                Write-Host "Backed up $target to $backup"
              } else {
                Write-Host "Nothing to back up: $target does not exist yet"
              }
              Get-ChildItem -Path $envRoot -Directory | Sort-Object LastWriteTime -Descending |
                Select-Object -Skip 5 | Remove-Item -Recurse -Force
            displayName: 'Back up IIS site before deploy'
          - powershell: |
              Write-Warning 'No deployment kind selected: add your deploy commands here. The package is at $(Pipeline.Workspace)/drop'
            displayName: 'Deploy to test'
          - powershell: |
              $uri = 'https://myapp-test.contoso.com/health'
              $expected = 200
              $timeout = 30
              $retries = 3
              for ($i = 1; $i -le $retries; $i++) {
                try {
                  $r = Invoke-WebRequest -Uri $uri -UseBasicParsing -TimeoutSec $timeout
                  if ($r.StatusCode -eq $expected) { Write-Host 'Health check passed'; exit 0 }
                } catch { Write-Warning "Attempt $i failed: $_" }
                Start-Sleep -Seconds 5
              }
              Write-Error 'HTTP health check failed'
              exit 1
            displayName: 'HTTP endpoint health check'
        on:
          failure:
            steps:
            - powershell: |
                $ErrorActionPreference = 'Stop'
                $envRoot = Join-Path 'D:\backups' 'test'
                $backup = Join-Path $envRoot '$(Build.BuildId)'
                if (-not (Test-Path $backup)) {
                  Write-Warning "No backup found at $backup (first deployment?). Nothing to roll back."
                  exit 0
                }
                $site = 'Default Web Site'
                $target = $null
                if (-not $target) {
                  Import-Module WebAdministration -ErrorAction Stop
                  $website = Get-Website -Name $site
                  if (-not $website) { throw "IIS website '$site' was not found" }
                  $target = [Environment]::ExpandEnvironmentVariables($website.PhysicalPath)
                }
                function Sync-Folder([string]$Source, [string]$Destination, [switch]$Mirror) {
                  New-Item -ItemType Directory -Force -Path $Destination | Out-Null
                  $mode = if ($Mirror) { '/MIR' } else { '/E' }
                  robocopy $Source $Destination $mode /R:2 /W:5 /NFL /NDL /NP | Out-Host
                  if ($LASTEXITCODE -ge 8) { throw "robocopy failed with exit code $LASTEXITCODE" }
                  $global:LASTEXITCODE = 0
                }
                Sync-Folder -Source $backup -Destination $target -Mirror
                Write-Host "Restored $target from $backup"
              displayName: 'Roll back IIS site'
