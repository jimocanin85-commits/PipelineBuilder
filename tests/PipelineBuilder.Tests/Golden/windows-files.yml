# Made with PipelineBuilder. To change it, open your saved settings there, or edit this file.
# Pipeline: my-app

# Runs when one of these branches changes.
trigger:
  branches:
    include:
      - 'main'
      - 'develop'

# The environments to deploy to, in order. Each must exist under Pipelines > Environments.
parameters:
- name: environments
  displayName: 'Environments, in deployment order'
  type: object
  default:
  - 'test'
  - 'preprod'
  - 'prod'

# Values used by the steps below.
variables:
  - name: BuildConfiguration
    value: Release

# Builds run on this agent. Deployments run on the servers registered in each environment.
pool:
  vmImage: 'ubuntu-latest'

stages:
# Build once, deploy many: the app is compiled, tested and packaged here. Every environment gets this same package.
- stage: Build
  displayName: 'Build'
  jobs:
  - job: BuildJob
    displayName: 'Build, test and package'
    steps:
      - task: DotNetCoreCLI@2
        displayName: 'Restore NuGet packages'
        inputs:
          command: 'restore'
          projects: '**/*.csproj'
      - task: DotNetCoreCLI@2
        displayName: 'Build'
        inputs:
          command: 'build'
          projects: '**/*.csproj'
          arguments: '--configuration $(BuildConfiguration) --no-restore'
      - task: DotNetCoreCLI@2
        displayName: 'Run tests'
        inputs:
          command: 'test'
          projects: '**/*Tests*.csproj'
          arguments: '--configuration $(BuildConfiguration) --no-build --collect:"XPlat Code Coverage"'
      - task: DotNetCoreCLI@2
        displayName: 'Publish application'
        inputs:
          command: 'publish'
          publishWebProjects: 'true'
          arguments: '--configuration $(BuildConfiguration) --no-build --output $(Build.ArtifactStagingDirectory)/app'
          zipAfterPublish: 'false'
          modifyOutputPath: 'false'
      - task: PublishPipelineArtifact@1
        displayName: 'Publish pipeline artifact: drop'
        inputs:
          targetPath: '$(Build.ArtifactStagingDirectory)/app'
          artifactName: 'drop'
          publishLocation: 'pipeline'
# Deploy: repeated for each environment, one after the other. Nothing is built again.
- ${{ each environment in parameters.environments }}:
  - stage: Deploy_${{ replace(environment, '-', '_') }}
    displayName: 'Deploy ${{ environment }}'
    # A pull request is built and tested, but never deployed.
    ${{ if notIn(environment, 'prod') }}:
      condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
    # Only the main branch deploys to prod.
    ${{ if in(environment, 'prod') }}:
      condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
    - deployment: Deploy
      displayName: 'Deploy to ${{ environment }}'
      # Runs on each server registered in this environment.
      environment:
        name: ${{ environment }}
        resourceType: VirtualMachine
      strategy:
        runOnce:
          deploy:
            steps:
              - download: none
              - task: DownloadPipelineArtifact@2
                displayName: 'Download artifact'
                inputs:
                  artifactName: 'drop'
                  targetPath: '$(Pipeline.Workspace)/drop'
              - powershell: |
                  $ErrorActionPreference = 'Stop'
                  $envRoot = Join-Path 'D:\backups' '${{ environment }}'
                  $backup = Join-Path $envRoot '$(Build.BuildId)'
                  $target = '$(DEPLOY_PATH)'
                  function Sync-Folder([string]$Source, [string]$Destination, [switch]$Mirror) {
                    # Stop if the folder is not set, so nothing is copied to or deleted from the wrong place.
                    if (-not $Destination -or $Destination.StartsWith('$(') -or $Destination -match '^([A-Za-z]:)?[\\/]*$') {
                      throw "The folder to copy to is not set: '$Destination'. Check the pipeline variables."
                    }
                    New-Item -ItemType Directory -Force -Path $Destination | Out-Null
                    $mode = if ($Mirror) { '/MIR' } else { '/E' }
                    robocopy $Source $Destination $mode /R:2 /W:5 /NFL /NDL /NP | Out-Host
                    if ($LASTEXITCODE -ge 8) { throw "robocopy failed with exit code $LASTEXITCODE" }
                    $global:LASTEXITCODE = 0
                  }
                  if (Test-Path $target) {
                    Sync-Folder -Source $target -Destination $backup
                    Write-Host "Backed up $target to $backup"
                  } else {
                    Write-Host "Nothing to back up: $target does not exist yet"
                  }
                  if (Test-Path $envRoot) {
                    Get-ChildItem -Path $envRoot -Directory | Sort-Object LastWriteTime -Descending |
                      Select-Object -Skip 5 | Remove-Item -Recurse -Force
                  }
                displayName: 'Back up deployment folder before deploy'
              - powershell: |
                  $ErrorActionPreference = 'Stop'
                  $target = '$(DEPLOY_PATH)'
                  $package = '$(Pipeline.Workspace)/drop'
                  function Sync-Folder([string]$Source, [string]$Destination, [switch]$Mirror) {
                    # Stop if the folder is not set, so nothing is copied to or deleted from the wrong place.
                    if (-not $Destination -or $Destination.StartsWith('$(') -or $Destination -match '^([A-Za-z]:)?[\\/]*$') {
                      throw "The folder to copy to is not set: '$Destination'. Check the pipeline variables."
                    }
                    New-Item -ItemType Directory -Force -Path $Destination | Out-Null
                    $mode = if ($Mirror) { '/MIR' } else { '/E' }
                    robocopy $Source $Destination $mode /R:2 /W:5 /NFL /NDL /NP | Out-Host
                    if ($LASTEXITCODE -ge 8) { throw "robocopy failed with exit code $LASTEXITCODE" }
                    $global:LASTEXITCODE = 0
                  }
                  if ($package -like '*.zip') {
                    $source = Join-Path $env:AGENT_TEMPDIRECTORY 'package'
                    Remove-Item -Path $source -Recurse -Force -ErrorAction SilentlyContinue
                    Expand-Archive -Path $package -DestinationPath $source -Force
                  } else {
                    $source = $package
                  }
                  Sync-Folder -Source $source -Destination $target -Mirror
                  Write-Host "Deployed to $target"
                displayName: 'Deploy to file share (${{ environment }})'
          # If a step above fails, the previous version is put back.
          on:
            failure:
              steps:
                - powershell: |
                    $ErrorActionPreference = 'Stop'
                    $envRoot = Join-Path 'D:\backups' '${{ environment }}'
                    $backup = Join-Path $envRoot '$(Build.BuildId)'
                    if (-not (Test-Path $backup)) {
                      Write-Warning "No backup found at $backup (first deployment?). Nothing to roll back."
                      exit 0
                    }
                    $target = '$(DEPLOY_PATH)'
                    function Sync-Folder([string]$Source, [string]$Destination, [switch]$Mirror) {
                      # Stop if the folder is not set, so nothing is copied to or deleted from the wrong place.
                      if (-not $Destination -or $Destination.StartsWith('$(') -or $Destination -match '^([A-Za-z]:)?[\\/]*$') {
                        throw "The folder to copy to is not set: '$Destination'. Check the pipeline variables."
                      }
                      New-Item -ItemType Directory -Force -Path $Destination | Out-Null
                      $mode = if ($Mirror) { '/MIR' } else { '/E' }
                      robocopy $Source $Destination $mode /R:2 /W:5 /NFL /NDL /NP | Out-Host
                      if ($LASTEXITCODE -ge 8) { throw "robocopy failed with exit code $LASTEXITCODE" }
                      $global:LASTEXITCODE = 0
                    }
                    Sync-Folder -Source $backup -Destination $target -Mirror
                    Write-Host "Restored $target from $backup"
                  displayName: 'Roll back file share'