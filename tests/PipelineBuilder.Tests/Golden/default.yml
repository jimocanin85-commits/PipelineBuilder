- stage: Notify_Failure
  displayName: 'Notify on failure'
  dependsOn: 
  - Build
  - Deploy_test
  - Deploy_preprod
  - Deploy_prod
  condition: failed()
  jobs:
  - job: Notify
    steps:
          - powershell: |
              $webhook = '$(TEAMS_WEBHOOK_URL)'
              if ([string]::IsNullOrWhiteSpace($webhook) -or $webhook.StartsWith('$(')) {
                Write-Warning 'Teams webhook variable is not set; skipping notification.'
                exit 0
              }
              $body = @{ text = "Pipeline $(Build.DefinitionName) #$(Build.BuildNumber) failed" } | ConvertTo-Json
              Invoke-RestMethod -Uri $webhook -Method Post -Body $body -ContentType 'application/json'
            displayName: 'Notify Teams on failure'