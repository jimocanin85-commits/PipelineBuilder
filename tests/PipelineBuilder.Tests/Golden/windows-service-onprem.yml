# Generated by PipelineBuilder - Enterprise Azure DevOps Pipeline
# Pipeline: my-app
trigger:
  branches:
    include:
      - 'main'
      - 'develop'

variables:
  - name: BuildConfiguration
    value: Release

pool:
  vmImage: 'windows-latest'

stages:
- stage: Build
  displayName: 'Build'
  jobs:
  - job: BuildJob
    displayName: 'Build, test and package'
    pool:
      vmImage: 'ubuntu-latest'
    steps:
          - task: DotNetCoreCLI@2
            displayName: 'Restore NuGet packages'
            inputs:
              command: 'restore'
              projects: '**/*.csproj'
          - task: DotNetCoreCLI@2
            displayName: 'Build'
            inputs:
              command: 'build'
              projects: '**/*.csproj'
              arguments: '--configuration $(BuildConfiguration) --no-restore'
          - task: DotNetCoreCLI@2
            displayName: 'Run tests'
            inputs:
              command: 'test'
              projects: '**/*Tests*.csproj'
              arguments: '--configuration $(BuildConfiguration) --no-build --collect:"XPlat Code Coverage"'
          - task: DotNetCoreCLI@2
            displayName: 'Publish application'
            inputs:
              command: 'publish'
              publishWebProjects: 'true'
              arguments: '--configuration $(BuildConfiguration) --no-build --output $(Build.ArtifactStagingDirectory)/app'
              zipAfterPublish: 'false'
              modifyOutputPath: 'false'
          - task: PublishPipelineArtifact@1
            displayName: 'Publish pipeline artifact: drop'
            inputs:
              targetPath: '$(Build.ArtifactStagingDirectory)/app'
              artifactName: 'drop'
              publishLocation: 'pipeline'
- stage: Deploy_test
  displayName: 'Deploy test'
  dependsOn: Build
  condition: succeeded()
  jobs:
  - deployment: DeployTotest
    displayName: 'Deploy to test'
    environment:
      name: test
      resourceType: VirtualMachine
    strategy:
      runOnce:
        deploy:
          steps:
          - download: none
          - task: DownloadPipelineArtifact@2
            displayName: 'Download artifact for test'
            inputs:
              artifactName: 'drop'
              targetPath: '$(Pipeline.Workspace)/drop'
          - powershell: |
              $ErrorActionPreference = 'Stop'
              $envRoot = Join-Path 'D:\backups' 'test'
              $backup = Join-Path $envRoot '$(Build.BuildId)'
              $target = '$(DEPLOY_PATH)'
              function Sync-Folder([string]$Source, [string]$Destination, [switch]$Mirror) {
                New-Item -ItemType Directory -Force -Path $Destination | Out-Null
                $mode = if ($Mirror) { '/MIR' } else { '/E' }
                robocopy $Source $Destination $mode /R:2 /W:5 /NFL /NDL /NP | Out-Host
                if ($LASTEXITCODE -ge 8) { throw "robocopy failed with exit code $LASTEXITCODE" }
                $global:LASTEXITCODE = 0
              }
              if (Test-Path $target) {
                Sync-Folder -Source $target -Destination $backup
                Write-Host "Backed up $target to $backup"
              } else {
                Write-Host "Nothing to back up: $target does not exist yet"
              }
              Get-ChildItem -Path $envRoot -Directory | Sort-Object LastWriteTime -Descending |
                Select-Object -Skip 5 | Remove-Item -Recurse -Force
            displayName: 'Back up deployment folder before deploy'
          - powershell: |
              $ErrorActionPreference = 'Stop'
              $service = '$(SERVICE_NAME)'
              $target = '$(DEPLOY_PATH)'
              $package = '$(Pipeline.Workspace)/drop'
              function Sync-Folder([string]$Source, [string]$Destination, [switch]$Mirror) {
                New-Item -ItemType Directory -Force -Path $Destination | Out-Null
                $mode = if ($Mirror) { '/MIR' } else { '/E' }
                robocopy $Source $Destination $mode /R:2 /W:5 /NFL /NDL /NP | Out-Host
                if ($LASTEXITCODE -ge 8) { throw "robocopy failed with exit code $LASTEXITCODE" }
                $global:LASTEXITCODE = 0
              }
              if ($package -like '*.zip') {
                $source = Join-Path $env:AGENT_TEMPDIRECTORY 'package'
                Remove-Item -Path $source -Recurse -Force -ErrorAction SilentlyContinue
                Expand-Archive -Path $package -DestinationPath $source -Force
              } else {
                $source = $package
              }
              $svc = Get-Service -Name $service -ErrorAction SilentlyContinue
              if ($svc -and $svc.Status -ne 'Stopped') {
                Stop-Service -Name $service -Force
                $svc.WaitForStatus('Stopped', [TimeSpan]::FromSeconds(60))
              }
              Sync-Folder -Source $source -Destination $target -Mirror
              if ($svc) { Start-Service -Name $service } else { Write-Warning "Service $service does not exist yet; create it before the first deployment." }
              Write-Host "Deployed to $target"
            displayName: 'Deploy Windows service (test)'
        on:
          failure:
            steps:
            - powershell: |
                $ErrorActionPreference = 'Stop'
                $envRoot = Join-Path 'D:\backups' 'test'
                $backup = Join-Path $envRoot '$(Build.BuildId)'
                if (-not (Test-Path $backup)) {
                  Write-Warning "No backup found at $backup (first deployment?). Nothing to roll back."
                  exit 0
                }
                $service = '$(SERVICE_NAME)'
                $target = '$(DEPLOY_PATH)'
                function Sync-Folder([string]$Source, [string]$Destination, [switch]$Mirror) {
                  New-Item -ItemType Directory -Force -Path $Destination | Out-Null
                  $mode = if ($Mirror) { '/MIR' } else { '/E' }
                  robocopy $Source $Destination $mode /R:2 /W:5 /NFL /NDL /NP | Out-Host
                  if ($LASTEXITCODE -ge 8) { throw "robocopy failed with exit code $LASTEXITCODE" }
                  $global:LASTEXITCODE = 0
                }
                Stop-Service -Name $service -Force -ErrorAction SilentlyContinue
                Sync-Folder -Source $backup -Destination $target -Mirror
                Start-Service -Name $service
                Write-Host "Restored $target from $backup and restarted $service"
              displayName: 'Roll back Windows service'
