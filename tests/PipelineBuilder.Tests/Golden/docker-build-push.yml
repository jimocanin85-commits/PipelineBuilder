# Generated by PipelineBuilder - Enterprise Azure DevOps Pipeline
# Pipeline: enterprise-pipeline
trigger:
  branches:
    include:
      - 'main'
      - 'develop'

variables:
  - group: 'vg-test'
  - name: BuildConfiguration
    value: Release

pool:
  vmImage: 'windows-latest'

stages:
- stage: Build
  displayName: 'Build'
  jobs:
  - job: BuildJob
    displayName: 'Build, test and package'
    pool:
      vmImage: 'ubuntu-latest'
    steps:
          - powershell: |
              Write-Warning 'Add the build and test commands for Docker projects here.'
            displayName: 'Build and test (placeholder)'
          - task: Docker@2
            displayName: 'Build and push Docker image'
            inputs:
              command: 'buildAndPush'
              repository: 'drop'
              dockerfile: '**/Dockerfile'
              containerRegistry: '$(DOCKER_SERVICE_CONNECTION)'
              tags: '$(Build.BuildId)'
- stage: Deploy_test
  displayName: 'Deploy test'
  dependsOn: Build
  condition: succeeded()
  jobs:
  - deployment: DeployTotest
    displayName: 'Deploy to test'
    environment:
      name: test
      resourceType: VirtualMachine
    strategy:
      runOnce:
        deploy:
          steps:
          - download: none
          - powershell: |
              $ErrorActionPreference = 'Stop'
              $envRoot = Join-Path 'D:\backups' 'test'
              $backup = Join-Path $envRoot '$(Build.BuildId)'
              # Windows PowerShell 5.1 turns redirected native stderr into errors under 'Stop'.
              $ErrorActionPreference = 'Continue'
              $name = '$(CONTAINER_NAME)'
              $info = docker inspect $name 2>$null | ConvertFrom-Json
              $global:LASTEXITCODE = 0
              if ($info) {
                New-Item -ItemType Directory -Force -Path $backup | Out-Null
                Set-Content -Path (Join-Path $backup 'image.txt') -Value $info[0].Config.Image
                Write-Host "Recorded running image $($info[0].Config.Image)"
              } else {
                Write-Host "Nothing to back up: container $name is not running"
              }
              Get-ChildItem -Path $envRoot -Directory | Sort-Object LastWriteTime -Descending |
                Select-Object -Skip 5 | Remove-Item -Recurse -Force
            displayName: 'Record running container image before deploy'
          - powershell: |
              # Windows PowerShell 5.1 turns redirected native stderr into errors under 'Stop'.
              $ErrorActionPreference = 'Continue'
              $image = '$(DOCKER_REGISTRY)/drop:$(Build.BuildId)'
              $name = '$(CONTAINER_NAME)'
              docker pull $image
              if ($LASTEXITCODE -ne 0) { throw "Command failed with exit code $LASTEXITCODE" }
              docker rm -f $name 2>$null
              docker run -d --name $name --restart unless-stopped $image
              if ($LASTEXITCODE -ne 0) { throw "Command failed with exit code $LASTEXITCODE" }
              Write-Host "Container $name is running $image"
            displayName: 'Run Docker container (test)'
          - powershell: |
              $uri = 'https://myapp-test.contoso.com/health'
              $expected = 200
              $timeout = 30
              $retries = 3
              for ($i = 1; $i -le $retries; $i++) {
                try {
                  $r = Invoke-WebRequest -Uri $uri -UseBasicParsing -TimeoutSec $timeout
                  if ($r.StatusCode -eq $expected) { Write-Host 'Health check passed'; exit 0 }
                } catch { Write-Warning "Attempt $i failed: $_" }
                Start-Sleep -Seconds 5
              }
              Write-Error 'HTTP health check failed'
              exit 1
            displayName: 'HTTP endpoint health check'
        on:
          failure:
            steps:
            - powershell: |
                $ErrorActionPreference = 'Stop'
                $envRoot = Join-Path 'D:\backups' 'test'
                $backup = Join-Path $envRoot '$(Build.BuildId)'
                # Windows PowerShell 5.1 turns redirected native stderr into errors under 'Stop'.
                $ErrorActionPreference = 'Continue'
                $record = Join-Path $backup 'image.txt'
                if (-not (Test-Path $record)) {
                  Write-Warning "No previous image recorded at $record. Nothing to roll back."
                  exit 0
                }
                $image = (Get-Content -Path $record -Raw).Trim()
                $name = '$(CONTAINER_NAME)'
                docker rm -f $name 2>$null
                docker run -d --name $name --restart unless-stopped $image
                if ($LASTEXITCODE -ne 0) { throw "Command failed with exit code $LASTEXITCODE" }
                Write-Host "Rolled back container $name to $image"
              displayName: 'Roll back Docker container'
