# Generated by PipelineBuilder - Enterprise Azure DevOps Pipeline
# Pipeline: enterprise-pipeline
trigger:
  branches:
    include:
      - 'main'
      - 'develop'

variables:
  - group: 'vg-test'
  - name: BuildConfiguration
    value: Release

pool:
  vmImage: 'windows-latest'

stages:
- stage: Build
  displayName: 'Build'
  jobs:
  - job: BuildJob
    displayName: 'Build, test and package'
    pool:
      vmImage: 'ubuntu-latest'
    steps:
          - powershell: |
              Write-Warning 'Add the build and test commands for Docker projects here.'
            displayName: 'Build and test (placeholder)'
          - task: Docker@2
            displayName: 'Build and push Docker image'
            inputs:
              command: 'buildAndPush'
              repository: 'drop'
              dockerfile: '**/Dockerfile'
              containerRegistry: '$(DOCKER_SERVICE_CONNECTION)'
              tags: '$(Build.BuildId)'
- stage: Deploy_test
  displayName: 'Deploy test'
  dependsOn: Build
  condition: succeeded()
  jobs:
  - deployment: DeployTotest
    displayName: 'Deploy to test'
    environment: test
    strategy:
      runOnce:
        deploy:
          steps:
          - download: none
          - checkout: self
          - task: KubernetesManifest@1
            displayName: 'Deploy to Kubernetes (test)'
            inputs:
              action: 'deploy'
              connectionType: 'kubernetesServiceConnection'
              kubernetesServiceConnection: '$(K8S_SERVICE_CONNECTION)'
              namespace: '$(K8S_NAMESPACE)'
              manifests: 'manifests/*.yaml'
              containers: '$(DOCKER_REGISTRY)/drop:$(Build.BuildId)'
          - powershell: |
              $uri = 'https://myapp-test.contoso.com/health'
              $expected = 200
              $timeout = 30
              $retries = 3
              for ($i = 1; $i -le $retries; $i++) {
                try {
                  $r = Invoke-WebRequest -Uri $uri -UseBasicParsing -TimeoutSec $timeout
                  if ($r.StatusCode -eq $expected) { Write-Host 'Health check passed'; exit 0 }
                } catch { Write-Warning "Attempt $i failed: $_" }
                Start-Sleep -Seconds 5
              }
              Write-Error 'HTTP health check failed'
              exit 1
            displayName: 'HTTP endpoint health check'
        on:
          failure:
            steps:
            - task: Kubernetes@1
              displayName: 'Roll back Kubernetes deployment'
              inputs:
                connectionType: 'Kubernetes Service Connection'
                kubernetesServiceEndpoint: '$(K8S_SERVICE_CONNECTION)'
                namespace: '$(K8S_NAMESPACE)'
                command: 'rollout'
                arguments: 'undo deployment/$(K8S_DEPLOYMENT)'
- stage: Deploy_prod
  displayName: 'Deploy prod'
  dependsOn: Deploy_test
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  variables:
    - group: 'vg-prod-secrets'
  jobs:
  - deployment: DeployToprod
    displayName: 'Deploy to prod'
    environment: prod
    strategy:
      runOnce:
        deploy:
          steps:
          - download: none
          - checkout: self
          - task: KubernetesManifest@1
            displayName: 'Deploy to Kubernetes (prod)'
            inputs:
              action: 'deploy'
              connectionType: 'kubernetesServiceConnection'
              kubernetesServiceConnection: '$(K8S_SERVICE_CONNECTION)'
              namespace: '$(K8S_NAMESPACE)'
              manifests: 'manifests/*.yaml'
              containers: '$(DOCKER_REGISTRY)/drop:$(Build.BuildId)'
          - powershell: |
              $uri = 'https://myapp-prod.contoso.com/health'
              $expected = 200
              $timeout = 30
              $retries = 3
              for ($i = 1; $i -le $retries; $i++) {
                try {
                  $r = Invoke-WebRequest -Uri $uri -UseBasicParsing -TimeoutSec $timeout
                  if ($r.StatusCode -eq $expected) { Write-Host 'Health check passed'; exit 0 }
                } catch { Write-Warning "Attempt $i failed: $_" }
                Start-Sleep -Seconds 5
              }
              Write-Error 'HTTP health check failed'
              exit 1
            displayName: 'HTTP endpoint health check'
        on:
          failure:
            steps:
            - task: Kubernetes@1
              displayName: 'Roll back Kubernetes deployment'
              inputs:
                connectionType: 'Kubernetes Service Connection'
                kubernetesServiceEndpoint: '$(K8S_SERVICE_CONNECTION)'
                namespace: '$(K8S_NAMESPACE)'
                command: 'rollout'
                arguments: 'undo deployment/$(K8S_DEPLOYMENT)'
- stage: Notify_Failure
  displayName: 'Notify on failure'
  dependsOn: 
  - Build
  - Deploy_test
  - Deploy_prod
  condition: failed()
  jobs:
  - job: Notify
    steps:
          - powershell: |
              $webhook = '$(TEAMS_WEBHOOK_URL)'
              if ([string]::IsNullOrWhiteSpace($webhook) -or $webhook.StartsWith('$(')) {
                Write-Warning 'Teams webhook variable is not set; skipping notification.'
                exit 0
              }
              $body = @{ text = "Pipeline $(Build.DefinitionName) #$(Build.BuildNumber) failed" } | ConvertTo-Json
              Invoke-RestMethod -Uri $webhook -Method Post -Body $body -ContentType 'application/json'
            displayName: 'Notify Teams on failure'