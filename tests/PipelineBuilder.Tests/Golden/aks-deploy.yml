# Made with PipelineBuilder. To change it, open your saved settings there, or edit this file.
# Pipeline: my-app

# Runs when one of these branches changes.
trigger:
  branches:
    include:
      - 'main'
      - 'develop'

# The environments to deploy to, in order. Each must exist under Pipelines > Environments.
parameters:
- name: environments
  displayName: 'Environments, in deployment order'
  type: object
  default:
  - 'test'
  - 'preprod'
  - 'prod'

# Values used by the steps below.
variables:
  - name: BuildConfiguration
    value: Release

# Builds and deployments run on this agent.
pool:
  vmImage: 'ubuntu-latest'

stages:
# Build once, deploy many: the Docker image is built and pushed here. Every environment gets this same image.
- stage: Build
  displayName: 'Build'
  jobs:
  - job: BuildJob
    displayName: 'Build, test and package'
    steps:
      - task: Docker@2
        displayName: 'Build and push Docker image'
        inputs:
          command: 'buildAndPush'
          repository: 'drop'
          dockerfile: '**/Dockerfile'
          containerRegistry: '$(DOCKER_SERVICE_CONNECTION)'
          tags: '$(Build.BuildId)'
# Deploy: repeated for each environment, one after the other. Nothing is built again.
- ${{ each environment in parameters.environments }}:
  - stage: Deploy_${{ replace(environment, '-', '_') }}
    displayName: 'Deploy ${{ environment }}'
    # A pull request is built and tested, but never deployed.
    ${{ if notIn(environment, 'prod') }}:
      condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
    # Only the main branch deploys to prod.
    ${{ if in(environment, 'prod') }}:
      condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
    - deployment: Deploy
      displayName: 'Deploy to ${{ environment }}'
      # Approvals and checks are set on this environment in Azure DevOps.
      environment: ${{ environment }}
      strategy:
        runOnce:
          deploy:
            steps:
              - download: none
              - checkout: self
              - task: KubernetesManifest@1
                displayName: 'Deploy to Kubernetes (${{ environment }})'
                inputs:
                  action: 'deploy'
                  connectionType: 'kubernetesServiceConnection'
                  kubernetesServiceConnection: '$(K8S_SERVICE_CONNECTION)'
                  namespace: '$(K8S_NAMESPACE)'
                  manifests: 'manifests/*.yaml'
                  containers: '$(DOCKER_REGISTRY)/drop:$(Build.BuildId)'
          # If a step above fails, the previous version is put back.
          on:
            failure:
              steps:
                - task: Kubernetes@1
                  displayName: 'Roll back Kubernetes deployment'
                  inputs:
                    connectionType: 'Kubernetes Service Connection'
                    kubernetesServiceEndpoint: '$(K8S_SERVICE_CONNECTION)'
                    namespace: '$(K8S_NAMESPACE)'
                    command: 'rollout'
                    arguments: 'undo deployment/$(K8S_DEPLOYMENT)'