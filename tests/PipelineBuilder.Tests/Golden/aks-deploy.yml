# Generated by PipelineBuilder - Enterprise Azure DevOps Pipeline
# Pipeline: my-app
trigger:
  branches:
    include:
      - 'main'
      - 'develop'

parameters:
- name: environments
  displayName: 'Environments, in deployment order'
  type: object
  default:
  - 'test'
  - 'prod'

variables:
  - name: BuildConfiguration
    value: Release

pool:
  vmImage: 'ubuntu-latest'

stages:
- stage: Build
  displayName: 'Build'
  jobs:
  - job: BuildJob
    displayName: 'Build, test and package'
    steps:
      - task: Docker@2
        displayName: 'Build and push Docker image'
        inputs:
          command: 'buildAndPush'
          repository: 'drop'
          dockerfile: '**/Dockerfile'
          containerRegistry: '$(DOCKER_SERVICE_CONNECTION)'
          tags: '$(Build.BuildId)'
- ${{ each environment in parameters.environments }}:
  - stage: Deploy_${{ replace(environment, '-', '_') }}
    displayName: 'Deploy ${{ environment }}'
    ${{ if in(environment, 'prod') }}:
      condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
    - deployment: Deploy
      displayName: 'Deploy to ${{ environment }}'
      environment: ${{ environment }}
      strategy:
        runOnce:
          deploy:
            steps:
              - download: none
              - checkout: self
              - task: KubernetesManifest@1
                displayName: 'Deploy to Kubernetes (${{ environment }})'
                inputs:
                  action: 'deploy'
                  connectionType: 'kubernetesServiceConnection'
                  kubernetesServiceConnection: '$(K8S_SERVICE_CONNECTION)'
                  namespace: '$(K8S_NAMESPACE)'
                  manifests: 'manifests/*.yaml'
                  containers: '$(DOCKER_REGISTRY)/drop:$(Build.BuildId)'
          on:
            failure:
              steps:
                - task: Kubernetes@1
                  displayName: 'Roll back Kubernetes deployment'
                  inputs:
                    connectionType: 'Kubernetes Service Connection'
                    kubernetesServiceEndpoint: '$(K8S_SERVICE_CONNECTION)'
                    namespace: '$(K8S_NAMESPACE)'
                    command: 'rollout'
                    arguments: 'undo deployment/$(K8S_DEPLOYMENT)'