# Generated by PipelineBuilder - Enterprise Azure DevOps Pipeline
# Pipeline: my-app
trigger:
  branches:
    include:
      - 'main'
      - 'develop'

parameters:
- name: environments
  displayName: 'Environments, in deployment order'
  type: object
  default:
  - 'test'
  - 'prod'

variables:
  - name: BuildConfiguration
    value: Release

pool:
  vmImage: 'ubuntu-latest'

stages:
- stage: Build
  displayName: 'Build'
  jobs:
  - job: BuildJob
    displayName: 'Build, test and package'
    steps:
      - task: NodeTool@0
        displayName: 'Use Node.js 24.x'
        inputs:
          versionSpec: '24.x'
      - task: Npm@1
        displayName: 'Install packages (npm ci)'
        inputs:
          command: 'ci'
      - task: Npm@1
        displayName: 'Build'
        inputs:
          command: 'custom'
          customCommand: 'run build --if-present'
        env:
          CI: 'true'
      - task: Npm@1
        displayName: 'Run tests'
        inputs:
          command: 'custom'
          customCommand: 'run test --if-present'
        env:
          CI: 'true'
      - task: CopyFiles@2
        displayName: 'Copy build output (dist)'
        inputs:
          SourceFolder: 'dist'
          Contents: '**'
          TargetFolder: '$(Build.ArtifactStagingDirectory)/app'
      - task: PublishPipelineArtifact@1
        displayName: 'Publish pipeline artifact: drop'
        inputs:
          targetPath: '$(Build.ArtifactStagingDirectory)/app'
          artifactName: 'drop'
          publishLocation: 'pipeline'
- ${{ each environment in parameters.environments }}:
  - stage: Deploy_${{ replace(environment, '-', '_') }}
    displayName: 'Deploy ${{ environment }}'
    ${{ if in(environment, 'prod') }}:
      condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
    - deployment: Deploy
      displayName: 'Deploy to ${{ environment }}'
      environment:
        name: ${{ environment }}
        resourceType: VirtualMachine
      strategy:
        runOnce:
          deploy:
            steps:
              - download: none
              - task: DownloadPipelineArtifact@2
                displayName: 'Download artifact'
                inputs:
                  artifactName: 'drop'
                  targetPath: '$(Pipeline.Workspace)/drop'
              - bash: |
                  set -euo pipefail
                  envRoot='/var/backups/pipelinebuilder/${{ environment }}'
                  backup="$envRoot/$(Build.BuildId)"
                  target='$(DEPLOY_PATH)'
                  sync_folder() {
                    mkdir -p "$2"
                    if command -v rsync >/dev/null 2>&1; then
                      rsync -a --delete "$1"/ "$2"/
                    else
                      find "$2" -mindepth 1 -delete
                      cp -a "$1"/. "$2"/
                    fi
                  }
                  if [ -d "$target" ]; then
                    sync_folder "$target" "$backup"
                    echo "Backed up $target to $backup"
                  else
                    echo "Nothing to back up: $target does not exist yet"
                  fi
                  if [ -d "$envRoot" ]; then
                    ls -1dt "$envRoot"/*/ 2>/dev/null | tail -n +6 | xargs -r rm -rf || true
                  fi
                displayName: 'Back up deployment folder before deploy'
              - bash: |
                  set -euo pipefail
                  service='$(SERVICE_NAME)'
                  target='$(DEPLOY_PATH)'
                  package='$(Pipeline.Workspace)/drop'
                  sync_folder() {
                    mkdir -p "$2"
                    if command -v rsync >/dev/null 2>&1; then
                      rsync -a --delete "$1"/ "$2"/
                    else
                      find "$2" -mindepth 1 -delete
                      cp -a "$1"/. "$2"/
                    fi
                  }
                  as_root() {
                    if [ "`id -u`" -eq 0 ]; then "$@"; else sudo -n "$@"; fi
                  }
                  if [[ "$package" == *.zip ]]; then
                    source="$AGENT_TEMPDIRECTORY/package"
                    rm -rf "$source"
                    mkdir -p "$source"
                    unzip -q "$package" -d "$source"
                  else
                    source="$package"
                  fi
                  as_root systemctl stop "$service" || echo "Service $service was not running"
                  sync_folder "$source" "$target"
                  as_root systemctl start "$service"
                  echo "Deployed to $target and started $service"
                displayName: 'Deploy Linux service (${{ environment }})'
          on:
            failure:
              steps:
                - bash: |
                    set -euo pipefail
                    envRoot='/var/backups/pipelinebuilder/${{ environment }}'
                    backup="$envRoot/$(Build.BuildId)"
                    if [ ! -d "$backup" ]; then
                      echo "##vso[task.logissue type=warning]No backup found at $backup (first deployment?). Nothing to roll back."
                      exit 0
                    fi
                    service='$(SERVICE_NAME)'
                    target='$(DEPLOY_PATH)'
                    sync_folder() {
                      mkdir -p "$2"
                      if command -v rsync >/dev/null 2>&1; then
                        rsync -a --delete "$1"/ "$2"/
                      else
                        find "$2" -mindepth 1 -delete
                        cp -a "$1"/. "$2"/
                      fi
                    }
                    as_root() {
                      if [ "`id -u`" -eq 0 ]; then "$@"; else sudo -n "$@"; fi
                    }
                    as_root systemctl stop "$service" || true
                    sync_folder "$backup" "$target"
                    as_root systemctl start "$service"
                    echo "Restored $target from $backup and restarted $service"
                  displayName: 'Roll back Linux service'